<title>/*TITLE*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0e1120;
    --panel: rgba(21, 25, 43, 0.86);
    --line: #2a3050;
    --text: #ebe6d6;
    --muted: #8f95b2;
    --lamp: #f2a541;
    --lamp-soft: rgba(242, 165, 65, 0.16);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--display);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: fixed;
    left: 16px; right: 16px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .hud.top { top: calc(16px + env(safe-area-inset-top, 0px)); justify-content: space-between; }
  .hud.bottom { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); justify-content: space-between; align-items: flex-end; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    padding: 14px 16px;
  }
  .title-card { display: grid; gap: 10px; max-width: 360px; }
  h1 {
    margin: 0;
    font-size: 22px; font-weight: 700; line-height: 1.1;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .sub { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }

  .switch { display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,0.25); border-radius: 8px; border: 1px solid var(--line); }
  .switch button {
    flex: 1;
    font: 500 13px/1 var(--display);
    color: var(--muted);
    background: transparent;
    border: 0; border-radius: 6px;
    padding: 9px 10px;
    cursor: pointer;
  }
  .switch button[aria-pressed="true"] { background: var(--lamp); color: #1b1407; }
  .switch button:hover:not([aria-pressed="true"]) { color: var(--text); }

  .stats {
    display: grid; grid-template-columns: repeat(3, auto); gap: 4px 20px;
    font-family: var(--mono); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .stats dt { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .stats dd { margin: 0; font-size: 15px; color: var(--text); }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .tool {
    font: 500 13px/1 var(--display);
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .tool:hover { border-color: var(--lamp); }
  .tool[aria-pressed="true"] { border-color: var(--lamp); background: var(--lamp-soft); color: var(--lamp); }
  button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

  .hint { font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.6; }
  .hint b { color: var(--text); font-weight: 500; }

  #photoLabel {
    font-family: var(--mono); font-size: 11px; color: var(--lamp);
    min-height: 1em;
  }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font-family: var(--mono); font-size: 13px; color: var(--muted);
  }

  @media (max-width: 640px) {
    .title-card { max-width: none; flex: 1 1 100%; }
    h1 { font-size: 19px; }
    .hint { display: none; }
    .stats { gap: 2px 14px; }
  }
</style>

<div id="stage"></div>
<div id="loading">Завантаження моделі…</div>

<div class="hud top">
  <div class="card title-card">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="switch" role="group" aria-label="Модель" id="switch"></div>
  </div>
</div>

<div class="hud bottom">
  <div class="card">
    <dl class="stats">
      <div><dt>Камер</dt><dd id="sCams">–</dd></div>
      <div><dt>Трикутників</dt><dd id="sFaces">–</dd></div>
      <div><dt>RMS репроєкції</dt><dd id="sRms">–</dd></div>
    </dl>
  </div>
  <div class="tools">
    <div class="hint"><b>Тягни</b> — обертати · <b>колесо</b> — масштаб · <b>права кнопка</b> — зсув<br><span id="photoLabel"></span></div>
    <button type="button" class="tool" id="btnCams" aria-pressed="true">Камери</button>
    <button type="button" class="tool" id="btnPrev">← Фото</button>
    <button type="button" class="tool" id="btnNext">Фото →</button>
    <button type="button" class="tool" id="btnReset">Загальний вид</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>/*DATA*/</script>
<script>
(function () {
  const MODELS = window.VIEWER.models;
  document.getElementById("title").textContent = window.VIEWER.title;
  document.getElementById("subtitle").textContent = window.VIEWER.subtitle;
  const switchEl = document.getElementById("switch");
  switchEl.hidden = MODELS.length < 2;
  const modelButtons = MODELS.map(function (m, i) {
    const b = document.createElement("button");
    b.type = "button";
    b.id = "btnModel" + i;
    b.textContent = m.name;
    b.addEventListener("click", function () { show(i); });
    switchEl.appendChild(b);
    return b;
  });
  const stage = document.getElementById("stage");

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0e1120);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 1000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  function b64(str, Type) {
    const bin = atob(str);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Type(bytes.buffer);
  }

  const groups = {};
  function build(key) {
    const d = MODELS[key];
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(b64(d.pos, Float32Array), 3));
    geo.setAttribute("color", new THREE.BufferAttribute(b64(d.col, Uint8Array), 3, true));
    geo.setIndex(new THREE.BufferAttribute(b64(d.idx, Uint32Array), 1));
    geo.computeBoundingSphere();
    // Кольори вже "освітлені" фотографією, тому без штучного світла
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));

    // Камери: пірамідки з вершиною в оптичному центрі, основа — рамка кадру
    const s = d.size * 0.08;
    const pts = [];
    d.cams.forEach(function (c) {
      const C = new THREE.Vector3().fromArray(c.c);
      const k = c.k.map(function (v) { return new THREE.Vector3().fromArray(v).multiplyScalar(s).add(C); });
      for (let i = 0; i < 4; i++) { pts.push(C, k[i], k[i], k[(i + 1) % 4]); }
    });
    const frusta = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0xf2a541 })
    );

    const g = new THREE.Group();
    g.add(mesh); g.add(frusta);
    g.userData = { data: d, frusta: frusta, center: geo.boundingSphere.center.clone(), radius: geo.boundingSphere.radius };
    return g;
  }

  let current = null, photoIndex = 0;

  function viewFromPhoto(i) {
    const d = current.userData.data;
    photoIndex = (i + d.cams.length) % d.cams.length;
    const c = d.cams[photoIndex];
    const C = new THREE.Vector3().fromArray(c.c);
    const F = new THREE.Vector3().fromArray(c.f).normalize();
    camera.position.copy(C);
    camera.up.fromArray(c.u);
    controls.target.copy(C.clone().add(F.multiplyScalar(d.depth)));
    controls.update();
    document.getElementById("photoLabel").textContent = "Вид з кадру #" + c.id + " · " + c.file;
  }

  function overview() {
    const u = current.userData;
    const first = u.data.cams[0];
    const C0 = new THREE.Vector3().fromArray(first.c);
    const dir = C0.clone().sub(u.center).normalize();
    camera.up.fromArray(first.u);
    camera.position.copy(u.center.clone().add(dir.multiplyScalar(u.radius * 1.9)));
    controls.target.copy(u.center);
    controls.update();
    document.getElementById("photoLabel").textContent = "";
  }

  function show(key) {
    if (!groups[key]) groups[key] = build(key);
    if (current) scene.remove(current);
    current = groups[key];
    current.userData.frusta.visible = document.getElementById("btnCams").getAttribute("aria-pressed") === "true";
    scene.add(current);
    const d = current.userData.data;
    camera.near = current.userData.radius * 0.002;
    camera.far = current.userData.radius * 50;
    camera.updateProjectionMatrix();
    document.getElementById("sCams").textContent = d.cams.length;
    document.getElementById("sFaces").textContent = d.nf.toLocaleString("uk-UA");
    document.getElementById("sRms").textContent = d.rms ? d.rms.toFixed(2) + " px" : "–";
    modelButtons.forEach(function (b, i) { b.setAttribute("aria-pressed", i === key); });
    viewFromPhoto(0);
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  document.getElementById("btnPrev").addEventListener("click", function () { viewFromPhoto(photoIndex - 1); });
  document.getElementById("btnNext").addEventListener("click", function () { viewFromPhoto(photoIndex + 1); });
  document.getElementById("btnReset").addEventListener("click", overview);
  document.getElementById("btnCams").addEventListener("click", function () {
    const on = this.getAttribute("aria-pressed") !== "true";
    this.setAttribute("aria-pressed", on);
    if (current) current.userData.frusta.visible = on;
  });

  resize();
  show(0);
  document.getElementById("loading").hidden = true;

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
